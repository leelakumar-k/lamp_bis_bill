services:
  restaurant-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-pos-api
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      - DATABASE_URL=postgresql://ecommerce:ecommerce@myecommerce-postgres:5432/ecommerce?options=-csearch_path%3Dmain_restaurants
      - DB_SCHEMA=main_restaurants
      - PORT=8005
      - HOST=0.0.0.0
    networks:
      - myecommerce_default

networks:
  myecommerce_default:
    external: true
